name: rephoto

# Frames of Me on Coolify (project "Frames of Me", environment "test"). Public exposure is through a
# Cloudflare Tunnel -> Coolify's Traefik, so NO service publishes a host port: each one only
# `expose`s its internal port and you map the FQDN in Coolify's UI (Service -> Domains).
#
#   FQDN mapping (public via Cloudflare Tunnel only — see docs/infra-coolify.md):
#     web          framesofme.com, www.framesofme.com   -> container port 3000
#     api          api.framesofme.com                   -> container port 8787
#   Do NOT map MinIO or Mailpit to a public hostname (ADR-002: media via API; prod uses SMTP).
#
# Secrets and URLs come from Coolify's Environment Variables (see .env.example). The ${VAR:-default}
# defaults are non-secret dev values so `docker compose -f docker-compose.coolify.yml up` also works
# locally for a smoke test; override every secret (SESSION_SECRET, S3_SECRET_KEY, POSTGRES_PASSWORD)
# in Coolify. No real secret is committed here.
#
# ONE variable has no default on purpose: S3_APP_SECRET_KEY (v6 hardening H3, see below and
# "MinIO credentials" in RUN.md). Without it `docker compose config` fails with a message
# naming it, and nothing is started. That is deliberate: the alternative was handing a public
# object store an application key whose secret is printed in this repository. For a local
# smoke test of this file:
#   S3_APP_SECRET_KEY=smoke-test-only docker compose -f docker-compose.coolify.yml up

x-app-env: &app_env
  DATABASE_URL: ${DATABASE_URL:-postgres://rephoto:rephoto@postgres:5432/rephoto}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  # The api signs presigned URLs against S3_ENDPOINT; it must be the public host the BROWSER uses
  # (SigV4 includes the host), i.e. https://s3.framesofme.com in Coolify.
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-rephoto}
  # v6 hardening H3 — least privilege. These used to read S3_ACCESS_KEY / S3_SECRET_KEY,
  # which the `minio` service below ALSO used as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD: the
  # api's own key WAS the MinIO root account. A leaked application key was therefore full
  # administrative access to the object store — delete any bucket, read the backup copy, add
  # users, rewrite policies — and that key lives in two long-running Node processes and signs
  # every presigned URL handed to a browser.
  #
  # `rephoto-app` may only get/put/delete objects inside S3_BUCKET; `minio-init` creates it
  # and attaches the policy (deploy/scripts/minio-provision.sh — the one provisioning path,
  # shared with deploy/compose.yml and the local docker-compose.yml). Root is used only by
  # minio-init and the MinIO console.
  #
  # S3_APP_SECRET_KEY is REQUIRED: a default here would be a published secret on a public
  # bucket. Generate one (`openssl rand -base64 24`) and add it in Coolify. Migration steps,
  # in order, and what happens if you deploy before doing them: RUN.md, "MinIO credentials".
  S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-rephoto-app}
  S3_SECRET_KEY: ${S3_APP_SECRET_KEY:?add S3_APP_SECRET_KEY in Coolify (v6 hardening H3; see "MinIO credentials" in RUN.md). It is the bucket-scoped application key for api and worker, and it must NOT be the MinIO root password.}
  S3_REGION: ${S3_REGION:-eu-central-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-please-32chars}
  FACE_ENGINE: ${FACE_ENGINE:-fake}
  FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face-service:8090}
  # Soglie InsightFace e rate limit del face-service — specchio di deploy/compose.yml:
  # senza queste righe i valori impostati in Coolify non arrivavano ai container.
  INSIGHTFACE_MIN_COSINE: ${INSIGHTFACE_MIN_COSINE:-0.50}
  INSIGHTFACE_SURE_COSINE: ${INSIGHTFACE_SURE_COSINE:-0.70}
  INSIGHTFACE_ATTACH_MIN_COSINE: ${INSIGHTFACE_ATTACH_MIN_COSINE:-0.55}
  INSIGHTFACE_MAX_FACES: ${INSIGHTFACE_MAX_FACES:-200}
  INSIGHTFACE_MIN_FACE_QUALITY: ${INSIGHTFACE_MIN_FACE_QUALITY:-0.2}
  FACE_INDEX_TPS: ${FACE_INDEX_TPS:-20}
  FACE_SEARCH_TPS: ${FACE_SEARCH_TPS:-20}
  # Liveness (v4 report F05): per gli eventi reali il runbook chiede LIVENESS_CHALLENGE=true.
  LIVENESS_CHECK: ${LIVENESS_CHECK:-false}
  LIVENESS_REQUIRED: ${LIVENESS_REQUIRED:-false}
  LIVENESS_CHALLENGE: ${LIVENESS_CHALLENGE:-false}
  LIVENESS_CHALLENGE_TURNS: ${LIVENESS_CHALLENGE_TURNS:-2}
  LIVENESS_CHALLENGE_TTL_SECONDS: ${LIVENESS_CHALLENGE_TTL_SECONDS:-120}
  LIVENESS_TURN_MIN_YAW: ${LIVENESS_TURN_MIN_YAW:-0.3}
  LIVENESS_FRONT_MAX_YAW: ${LIVENESS_FRONT_MAX_YAW:-0.2}
  LIVENESS_IDENTITY_MIN_COSINE: ${LIVENESS_IDENTITY_MIN_COSINE:-0.4}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  REKOGNITION_COLLECTION_PREFIX: ${REKOGNITION_COLLECTION_PREFIX:-rephoto-}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-noreply@framesofme.com}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  API_ORIGIN: ${API_ORIGIN:-http://api:8787}
  # Cloudflare + Traefik sit in front of the api: the client IP is 2 hops from the end of x-forwarded-for.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
  BOOTSTRAP_ADMINS: ${BOOTSTRAP_ADMINS:-}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-rephoto-redis}@redis:6379}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-coolify}
  MEDIA_VIA_API: ${MEDIA_VIA_API:-true}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rephoto-redis}", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rephoto-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    # pgvector-enabled Postgres 16 (needed when FACE_ENGINE=insightface; harmless otherwise).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rephoto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rephoto}
      POSTGRES_DB: ${POSTGRES_DB:-rephoto}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rephoto} -d ${POSTGRES_DB:-rephoto}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  minio:
    # FQDN in Coolify: s3.framesofme.com -> 9000 (the browser PUTs/GETs presigned URLs here).
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # v6 hardening H3: root is its own account now, not the api's key. It deliberately
      # falls back to the OLD variables, so an existing deployment keeps the root account it
      # already has until MINIO_ROOT_USER / MINIO_ROOT_PASSWORD are set in Coolify. Renaming
      # outright would silently change who root is on the next deploy — and MinIO reads root
      # from the environment on every start, so that is a real change, not a no-op.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY:-rephoto}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY:-rephoto-secret}}
      # Allow the browser on the web origin to PUT directly to presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  minio-init:
    # Creates the bucket, the bucket-scoped `rephoto-app` policy and the application user api
    # and worker sign with (v6 hardening H3), and the lifecycle rule that expires selfie
    # objects (selfies/*) after a day, so any kept selfie (KEEP_SELFIES) is deleted
    # automatically. Runs once per deploy and exits; idempotent.
    #
    # This is the ONLY place the MinIO root credentials are used.
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY:-rephoto}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY:-rephoto-secret}}
      S3_BUCKET: ${S3_BUCKET:-rephoto}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-rephoto-app}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?add S3_APP_SECRET_KEY in Coolify (v6 hardening H3; see "MinIO credentials" in RUN.md). It is the bucket-scoped application key for api and worker, and it must NOT be the MinIO root password.}
      # Keeps this file's pre-H3 behaviour: selfies/* expires after a day. Left unset in the
      # local and deploy/ stacks, where the script skips the rule entirely.
      S3_SELFIE_EXPIRE_DAYS: ${S3_SELFIE_EXPIRE_DAYS:-1}
    volumes:
      # The one provisioning path, shared with deploy/compose.yml and docker-compose.yml.
      - ./deploy/scripts/minio-provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    restart: "no"

  mailpit:
    # FQDN in Coolify: mail.framesofme.com -> 8025 (UI, behind Cloudflare Access). SMTP is 1025 (internal).
    # Swap for a real SMTP provider in production (set MAIL_* / SMTP_* and drop this service).
    image: axllent/mailpit:latest
    expose:
      - "1025"
      - "8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATA_FILE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  migrate:
    # One-shot: runs the schema migrations and seeds the demo event, then exits 0. api and worker
    # wait for it (service_completed_successfully), so the first boot is deterministic and the
    # worker never migrates. SEED_DEMO=true is set HERE ONLY (creates the demo event + passwordless
    # demo users); it is left unset on api/worker so no known demo password is seeded on a public site.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "--import", "tsx", "/app/packages/db/src/seed.ts"]
    environment:
      <<: *app_env
      NODE_ENV: development
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    # FQDN in Coolify: api.framesofme.com -> 8787. /health must return 200.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app_env
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  worker:
    # No FQDN: not a server. Processes jobs; Docker/Coolify restart it on exit.
    # Inherits REDIS_URL from *app_env for compose symmetry only — the worker does not use Redis.
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app_env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_PUBLISH_METRICS: ${WORKER_PUBLISH_METRICS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  backup:
    # Off-site copy: set BACKUP_RESTIC_REPOSITORY + RESTIC_PASSWORD in Coolify (see docs/ops/backup-coolify.md).
    image: restic/restic:0.17.3
    profiles: ["backup"]
    environment:
      RESTIC_REPOSITORY: ${BACKUP_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_AT: ${BACKUP_AT:-03:30}
    volumes:
      - postgres_data:/data/postgres:ro
      - minio_data:/data/minio:ro
      - ./deploy/scripts/backup-coolify.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  web:
    # FQDN in Coolify: framesofme.com + www.framesofme.com -> 3000. The web app proxies /v1/* to the api.
    # NEXT_PUBLIC_* are inlined at build time: set them as build args (Coolify: Build Variables).
    #
    # Traefik labels: Coolify's domain UI usually adds labels automatically, but explicit labels
    # here ensure routing survives Redeploy and handle both apex + www. Production and staging run
    # on the same Traefik (coolify-proxy on e0), so routers MUST have unique names to avoid collision.
    #
    # Setup per environment (set in Coolify Environment Variables):
    #   Production:  WEB_ROUTER_NAME=web-prod    WEB_DOMAIN=framesofme.com
    #   Staging:     WEB_ROUTER_NAME=web-staging WEB_DOMAIN=staging.framesofme.com
    #
    # Both are REQUIRED (no defaults that could let staging claim production hosts). Cloudflare
    # Tunnel e0-home -> Traefik handles TLS, so Traefik receives HTTP on entrypoint `web` (not
    # `websecure`). No TLS/certresolver in labels — Cloudflare already terminated it.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_EVENT_SLUG: ${NEXT_PUBLIC_EVENT_SLUG:-demo}
        NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-http://localhost:9000}
        NEXT_PUBLIC_WEB_ORIGIN: ${NEXT_PUBLIC_WEB_ORIGIN:-http://localhost:3000}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8787}
      NEXT_PUBLIC_EVENT_SLUG: ${NEXT_PUBLIC_EVENT_SLUG:-demo}
      NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-http://localhost:9000}
      NEXT_PUBLIC_WEB_ORIGIN: ${NEXT_PUBLIC_WEB_ORIGIN:-http://localhost:3000}
    expose:
      - "3000"
    labels:
      # Apex router (framesofme.com or staging.framesofme.com)
      - "traefik.enable=true"
      - "traefik.http.routers.${WEB_ROUTER_NAME:?WEB_ROUTER_NAME required (web-prod or web-staging)}.rule=Host(`${WEB_DOMAIN:?WEB_DOMAIN required (framesofme.com or staging.framesofme.com)}`)"
      - "traefik.http.routers.${WEB_ROUTER_NAME}.entrypoints=web"
      - "traefik.http.routers.${WEB_ROUTER_NAME}.priority=${WEB_TRAEFIK_PRIORITY:-1100}"
      - "traefik.http.routers.${WEB_ROUTER_NAME}.service=${WEB_ROUTER_NAME}-svc"
      - "traefik.http.services.${WEB_ROUTER_NAME}-svc.loadbalancer.server.port=3000"
      # www router (www.framesofme.com or www.staging.framesofme.com) -> redirect to apex
      - "traefik.http.routers.${WEB_ROUTER_NAME}-www.rule=Host(`www.${WEB_DOMAIN}`)"
      - "traefik.http.routers.${WEB_ROUTER_NAME}-www.entrypoints=web"
      - "traefik.http.routers.${WEB_ROUTER_NAME}-www.priority=${WEB_TRAEFIK_PRIORITY:-1100}"
      - "traefik.http.routers.${WEB_ROUTER_NAME}-www.middlewares=${WEB_ROUTER_NAME}-www-redirect"
      - "traefik.http.middlewares.${WEB_ROUTER_NAME}-www-redirect.redirectregex.regex=^http://www\\.(.+)"
      - "traefik.http.middlewares.${WEB_ROUTER_NAME}-www-redirect.redirectregex.replacement=http://$${1}"
      - "traefik.http.middlewares.${WEB_ROUTER_NAME}-www-redirect.redirectregex.permanent=true"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # Optional: self-hosted face engine (InsightFace on CPU). Only needed when FACE_ENGINE=insightface.
  # The first build downloads the model pack (~280 MB). Remove this service when using FACE_ENGINE=fake.
  face-service:
    build:
      context: apps/face-service
    expose:
      - "8090"
    environment:
      ONNX_THREADS: ${ONNX_THREADS:-4}
      DET_SIZE: ${FACE_DET_SIZE:-1024}
      DET_LONG_EDGE: ${FACE_DET_LONG_EDGE:-2560}
      UVICORN_WORKERS: ${FACE_SERVICE_WORKERS:-1}
      MODEL_CONCURRENCY: ${FACE_MODEL_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
  redis_data:
