<div class="login-page">
  <a routerLink="/" class="back" aria-label="Torna alla pagina iniziale">
    <img src="assets/logo/logo.svg" alt="frames of me" height="32" />
  </a>

  <main class="login-col">
    <div class="login-sheep">
      <app-pecorella [size]="132" />
    </div>

    <h1 class="display login-title">{{ title() }}</h1>
    <p class="login-sub">{{ subtitle() }}</p>

    <div class="segmented" role="tablist" aria-label="Tipo di account">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="role() === 'participant'"
        [class.is-active]="role() === 'participant'"
        (click)="setRole('participant')"
      >
        Partecipante
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="role() === 'photographer'"
        [class.is-active]="role() === 'photographer'"
        (click)="setRole('photographer')"
      >
        Fotografo
      </button>
    </div>

    <form class="login-form" (submit)="$event.preventDefault()">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input-line" id="email" type="email" name="email" autocomplete="email" placeholder="nome@esempio.it" />
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="input-line" id="password" type="password" name="password" autocomplete="current-password" placeholder="La tua password" />
      </div>
      <button class="btn btn-action btn-lg login-submit" type="submit">Accedi</button>
    </form>

    <div class="divider" role="separator" aria-label="oppure">
      <span>oppure</span>
    </div>

    <div class="alt-actions">
      <button class="btn btn-line google" type="button" disabled title="Disponibile a breve">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Continua con Google
      </button>
      <p class="soon">L'accesso con Google arriva a breve.</p>
      <button class="btn btn-line" type="button">Ricevi un link via email</button>
    </div>

    <p class="register">
      Serve un account?
      <a href="#" aria-disabled="true" title="Disponibile a breve">Registrati</a>&nbsp;<span class="soon-inline">(a breve)</span>
    </p>
  </main>
</div>
