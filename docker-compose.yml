name: rephoto

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rephoto
      POSTGRES_PASSWORD: rephoto
      POSTGRES_DB: rephoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rephoto -d rephoto"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rephoto
      MINIO_ROOT_PASSWORD: rephoto-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/bin/mc alias set local http://minio:9000 rephoto rephoto-secret
        /usr/bin/mc mb --ignore-existing local/rephoto
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
