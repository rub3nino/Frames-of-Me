name: rephoto

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rephoto
      POSTGRES_PASSWORD: rephoto
      POSTGRES_DB: rephoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rephoto -d rephoto"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rephoto
      MINIO_ROOT_PASSWORD: rephoto-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 rephoto rephoto-dev
        mc mb --ignore-existing local/rephoto
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &app_env
      DATABASE_URL: postgres://rephoto:rephoto@postgres:5432/rephoto
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rephoto
      S3_ACCESS_KEY_ID: rephoto
      S3_SECRET_ACCESS_KEY: rephoto-dev
      S3_REGION: eu-central-1
      MAIL_TRANSPORT: smtp
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_UI_URL: http://localhost:8025
      FACE_ENGINE: fake
      REKOGNITION_COLLECTION_PREFIX: rephoto
      REKOGNITION_MIN_SIMILARITY: "90"
      AWS_REGION: eu-central-1
      SESSION_SECRET: dev-only-change-me-please
      EVENT_SLUG: demo
      ADMIN_EMAIL: admin@example.com
      PUBLIC_WEB_URL: http://localhost:3000
      API_PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_WEB_URL: http://localhost:3000
      API_PROXY_TARGET: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
