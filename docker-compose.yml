name: rephoto

# Infra services (postgres, minio, mailpit) start by default; api/worker/web are host
# processes in dev (see RUN.md). The `app` profile builds the three Dockerfiles and runs
# the whole stack end to end for smoke tests:
#   docker compose --profile app up --build
#
# Honest limitation of the `app` profile: the api signs S3 URLs against S3_ENDPOINT, which
# inside the compose network is http://minio:9000. Those presigned URLs are returned to the
# browser on the host, where `minio` does not resolve. Map it once on the host:
#   echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
# With that line the browser reaches the same MinIO through port 9000 and the signatures
# stay valid (SigV4 includes the host header, so the name has to be the same one the api
# used). Without it, uploads and thumbnails fail in the browser while the api/worker work.

# Shared api/worker/migrate environment (local dev defaults). Referenced with *app_env.
x-app-env: &app_env
  DATABASE_URL: postgres://rephoto:rephoto@postgres:5432/rephoto
  DATABASE_POOL_MAX: "10"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: rephoto
  # v6 hardening H3 — least privilege, locally too (agent F did this for deploy/compose.yml in
  # F2 and deliberately left this file alone so a running dev stack would not break).
  #
  # These used to be `rephoto` / `rephoto-secret`, i.e. MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
  # of the `minio` service below. The credentials that sit in two long-running Node processes
  # and sign every presigned URL handed to a browser were the MinIO superuser: create and
  # delete any bucket, read the backup copy, add users, rewrite policies. `rephoto-app` may
  # only get/put/delete objects inside S3_BUCKET — `minio-init` creates it and attaches the
  # policy (deploy/scripts/minio-provision.sh, the same script production uses).
  #
  # Root stays for minio-init, the MinIO console on :9001 and `mc`.
  # Existing stack: see "MinIO credentials" in RUN.md — your `.env` needs the same two lines.
  S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-rephoto-app}
  S3_SECRET_KEY: ${S3_APP_SECRET_KEY:-rephoto-app-secret}
  S3_REGION: eu-central-1
  S3_FORCE_PATH_STYLE: "true"
  SESSION_SECRET: dev-only-change-me-please-32chars
  FACE_ENGINE: fake
  FACE_SERVICE_URL: http://face-service:8090
  AWS_REGION: eu-central-1
  REKOGNITION_COLLECTION_PREFIX: rephoto-
  MAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: noreply@rephoto.local
  WEB_ORIGIN: http://localhost:3000
  API_ORIGIN: http://api:8787
  TRUSTED_PROXY_HOPS: "1"
  WORKER_CONCURRENCY: "4"
  WORKER_PUBLISH_METRICS: "false"

services:
  postgres:
    # pgvector-enabled build of Postgres 16 (same major: the existing volume keeps working).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rephoto
      POSTGRES_PASSWORD: rephoto
      POSTGRES_DB: rephoto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rephoto -d rephoto"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rephoto
      MINIO_ROOT_PASSWORD: rephoto-secret
      # Lets the browser PUT directly to presigned URLs; the Next.js /api/s3-put proxy is a fallback.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Root is used HERE and nowhere else: the script authenticates with it to create the
      # bucket, the `rephoto-app` bucket-scoped policy and the application user that api and
      # worker sign with (v6 H3; production does the same in deploy/compose.yml).
      MINIO_ROOT_USER: rephoto
      MINIO_ROOT_PASSWORD: rephoto-secret
      S3_BUCKET: rephoto
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:-rephoto-app}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:-rephoto-app-secret}
    volumes:
      # The one provisioning path, shared with production: no second copy to drift.
      - ./deploy/scripts/minio-provision.sh:/provision.sh:ro
    # Idempotent: it runs on every `up`, and changing S3_APP_SECRET_KEY rotates the key.
    entrypoint: ["/bin/sh", "/provision.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Self-hosted face engine (InsightFace on CPU). Starts by default; the first build
  # downloads the model pack (~280 MB). The api/worker use it with FACE_ENGINE=insightface.
  face-service:
    build:
      context: apps/face-service
    ports:
      - "8090:8090"
    environment:
      # intra-op threads per inference; defaults to the CPU count inside the container
      ONNX_THREADS: "4"
      DET_SIZE: ${FACE_DET_SIZE:-1024}
      DET_LONG_EDGE: ${FACE_DET_LONG_EDGE:-2560}
      UVICORN_WORKERS: ${FACE_SERVICE_WORKERS:-1}
      MODEL_CONCURRENCY: ${FACE_MODEL_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ---- optional `app` profile: the three images built from the Dockerfiles ----

  # One-shot: migrate the schema and seed the demo event, then exit 0. api and worker wait for it,
  # so the worker never migrates and the first boot is deterministic. (In host-process dev, run
  # `pnpm db:seed` once instead — see RUN.md.)
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "--import", "tsx", "/app/packages/db/src/seed.ts"]
    environment:
      <<: *app_env
      # The image is NODE_ENV=production; override so seedDemo runs and creates the demo event.
      NODE_ENV: development
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app_env
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_EVENT_SLUG: demo
        NEXT_PUBLIC_MEDIA_ORIGINS: http://localhost:9000 http://minio:9000
        NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
    environment:
      API_PROXY_TARGET: http://api:8787
      NEXT_PUBLIC_EVENT_SLUG: demo
      NEXT_PUBLIC_MEDIA_ORIGINS: http://localhost:9000 http://minio:9000
      NEXT_PUBLIC_WEB_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
